
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        body {
            background-color: #fce8ef;
            color: #593b48;
            font-family: Georgia, serif;}

        .container-box {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            background-color: #fffafd;
            border-radius: 10px;}

        h1 {
            text-align: center;
            color: #b45c7a;}

        .subtitle {
            text-align: center;
            color: #896b78;
            margin-bottom: 25px;}

        .form-control {
            border-color: #e7c3d1;}

        .form-control:focus {
            border-color: #c77c99;}

        .btn-custom {
            background-color: #c77c99;
            color: white;
            border: none;}

        .btn-custom:hover {
            background-color: #ad5f7d;
            color: white;}

        #message {
            text-align: center;
            margin-top: 20px;}

        #output {
            text-align: center;}

        hr {
            border-color: #e7c3d1;}
    </style>
</head>

<body class="container">
    <div class="container-box">
        <h1>Guest List</h1>

        <p class="subtitle">Check if your name is on the invitation list.</p>

        <div class="mb-3"><label for="first_name" class="form-label">First Name</label>
            <input type="text" id="first_name" class="form-control"
                placeholder="Enter first name"></div>

        <div class="mb-3">
            <label for="last_name" class="form-label">Last Name</label>
            <input type="text" id="last_name" class="form-control"
                placeholder="Enter last name">
        </div>

        <button type="button" class="btn btn-custom w-100"
            py-click="check_name">
            Check Invitation
        </button>
        <p id="message">Your result will appear here.</p>
        <div id="output"></div>

    </div>

    <py-script src="main.py"></py-script>

</body>
</html>
